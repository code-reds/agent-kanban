            application/json:
              schema:
                $ref: '#/components/schemas/TokenListResponse'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      summary: Create a new API token (Human User only)
      tags:
        - Tokens
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: role
          in: query
          description: Caller role for permission checks
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /projects/{slug}/tokens/{tokenId}:

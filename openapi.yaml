openapi: "3.1.0"
info:
  title: Agent Kanban REST API
  description: REST API for managing Kanban projects, tickets, columns, workflows, roles, agent communications (conversations), and global settings. Each MCP server process is associated with a role that determines permissions.
  version: "1.0.0"
  contact:
    name: Agent Kanban Team

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

paths:
  # ==========================================================================
  # PROJECTS
  # ==========================================================================
  /projects:
    get:
      summary: List all projects
      tags:
        - Projects
      parameters:
        - name: q
          in: query
          description: Search by project name or slug
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
    post:
      summary: Create a new project
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /projects/{slug}:
    get:
      summary: Get project details
      tags:
        - Projects
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details with columns, roles, and workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update project
      tags:
        - Projects
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete project (cascade deletes all associated data)
      tags:
        - Projects
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================================
  # COLUMNS
  # ==========================================================================
  /projects/{slug}/columns:
    get:
      summary: List columns for a project
      tags:
        - Columns
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of columns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnListResponse'
    post:
      summary: Add column to a project
      tags:
        - Columns
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumnRequest'
      responses:
        '201':
          description: Column created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnResponse'

  /projects/{slug}/columns/{columnId}:
    patch:
      summary: Update a column
      tags:
        - Columns
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: columnId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateColumnRequest'
      responses:
        '200':
          description: Column updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnResponse'
    delete:
      summary: Delete a column (fails if non-empty or default)
      tags:
        - Columns
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: columnId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Column deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          $ref: '#/components/responses/ConflictError'

  # ==========================================================================
  # WORKFLOW (project-level)
  # ==========================================================================
  /projects/{slug}/workflow:
    get:
      summary: Get workflow transitions and access rules for a project
      tags:
        - Workflow
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
    post:
      summary: Add a workflow transition
      tags:
        - Workflow
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransitionRequest'
      responses:
        '201':
          description: Transition added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionResponse'

  /projects/{slug}/workflow/{transitionId}:
    delete:
      summary: Remove a workflow transition
      tags:
        - Workflow
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: transitionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Transition removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    patch:
      summary: Update a workflow transition's properties
      tags:
        - Workflow
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: transitionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransitionRequest'
      responses:
        '200':
          description: Transition updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionResponse'

  # ==========================================================================
  # ACCESS RULES (project-level)
  # ==========================================================================
  /projects/{slug}/access-rules:
    get:
      summary: Get all access rules for a project
      tags:
        - Access Rules
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of access rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRulesListResponse'
    patch:
      summary: Bulk update access rules
      tags:
        - Access Rules
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rules
              properties:
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/AccessRule'
      responses:
        '200':
          description: Access rules updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRulesListResponse'

  # ==========================================================================
  # ROLES (project-level)
  # ==========================================================================
  /projects/{slug}/roles:
    get:
      summary: Get all roles with access levels for a project
      tags:
        - Roles
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'

  /projects/{slug}/roles/{roleId}:
    patch:
      summary: Update a role (name/description)
      tags:
        - Roles
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'

  # ==========================================================================
  # ROLES-COLUMNS (project-level)
  # ==========================================================================
  /projects/{slug}/roles-columns:
    get:
      summary: Get combined project and global roles_columns mappings
      tags:
        - Roles
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of roles_columns mappings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesColumnsListResponse'
    post:
      summary: Create a project-specific roles_columns override
      tags:
        - Roles
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRolesColumnRequest'
      responses:
        '201':
          description: Roles-column mapping created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesColumnResponse'

  /projects/{slug}/roles-columns/{roleId}:
    patch:
      summary: Update a project-specific roles_columns override
      tags:
        - Roles
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolesColumnRequest'
      responses:
        '200':
          description: Roles-column mapping updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesColumnResponse'
    delete:
      summary: Delete a project-specific roles_columns override
      tags:
        - Roles
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Roles-column mapping deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean

  # ==========================================================================
  # TICKETS
  # ==========================================================================
  /projects/{slug}/tickets:
    get:
      summary: List tickets with filters
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: column
          in: query
          description: Filter by column slug
          required: false
          schema:
            type: string
        - name: priority
          in: query
          description: Filter by priority (1=urgent, 2=high, 3=medium, 4=low, 5=trivial)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: labels
          in: query
          description: Comma-separated labels filter (any match)
          required: false
          schema:
            type: string
        - name: parent_id
          in: query
          description: Filter by parent ticket ID (returns sub-tickets)
          required: false
          schema:
            type: integer
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: "Items per page (default: 20, max: 1000)"
          required: false
          schema:
            type: integer
            default: 20
            maximum: 1000
        - name: sort_by
          in: query
          description: "Sort field (default: created_at)"
          required: false
          schema:
            type: string
            enum:
              - priority
              - created_at
              - updated_at
              - title
            default: created_at
        - name: sort_order
          in: query
          description: Sort direction
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: mode
          in: query
          description: "Filter mode. 'not-blocked': unblocked only. 'top-level-tickets': parent tickets only"
          required: false
          schema:
            type: string
            enum:
              - not-blocked
              - top-level-tickets
        - name: all_tickets
          in: query
          description: Include all tickets (overrides column filter)
          required: false
          schema:
            type: boolean
            default: false
        - name: done_limit
          in: query
          description: Limit the number of done column tickets returned
          required: false
          schema:
            type: integer
        - name: filter_blocked
          in: query
          description: Exclude blocked, closed, and human_feedback tickets (optimized query)
          required: false
          schema:
            type: boolean
        - name: include_closed
          in: query
          description: "Whether to include closed tickets (default: true)"
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketListResponse'
    post:
      summary: Create a new ticket
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'

  /projects/{slug}/tickets/{ticketId}:
    get:
      summary: Get ticket details
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ticket details with comments, dependencies, and history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a ticket
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a ticket
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
        - name: role_id
          in: query
          description: Role ID of the actor performing the deletion
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Ticket deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                      ticket_id:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{slug}/tickets/{ticketId}/transitions:
    get:
      summary: Get allowed transitions for a ticket
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Allowed transitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionsListResponse'

  /projects/{slug}/tickets/{ticketId}/move:
    post:
      summary: Move a ticket to another column
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveTicketRequest'
      responses:
        '200':
          description: Ticket moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      moved:
                        type: boolean
                      ticket_id:
                        type: integer
                      to_column:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WorkflowError'

  # ==========================================================================
  # TICKET COMMENTS
  # ==========================================================================
  /projects/{slug}/tickets/{ticketId}/comments:
    post:
      summary: Add a comment to a ticket
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentRequest'
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'

  /projects/{slug}/tickets/{ticketId}/comments/{commentId}:
    patch:
      summary: Update a comment
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
    delete:
      summary: Delete a comment
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role_id:
                  type: integer
      responses:
        '200':
          description: Comment deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                      comment_id:
                        type: integer

  # ==========================================================================
  # TICKET DEPENDENCIES
  # ==========================================================================
  /projects/{slug}/tickets/{ticketId}/dependencies:
    get:
      summary: Get ticket dependencies grouped by type
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dependencies grouped by type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependenciesResponse'
    delete:
      summary: Remove a dependency (query parameters)
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
        - name: depends_on_id
          in: query
          required: true
          description: The dependency ticket ID
          schema:
            type: integer
        - name: relation_type
          in: query
          required: true
          description: The dependency relation type
          schema:
            type: string
            enum:
              - blocked_by
              - depends_on
              - related
      responses:
        '200':
          description: Dependency removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      removed:
                        type: boolean
                      ticket_id:
                        type: integer
                      depends_on_id:
                        type: integer
        '400':
          $ref: '#/components/responses/ValidationError'

  /projects/{slug}/tickets/{ticketId}/dependencies/{relationType}/{depId}:
    post:
      summary: Add a dependency (path-based)
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
        - name: relationType
          in: path
          required: true
          description: The dependency relation type
          schema:
            type: string
            enum:
              - blocked_by
              - depends_on
              - related
        - name: depId
          in: path
          required: true
          description: The dependency ticket ID
          schema:
            type: integer
      responses:
        '201':
          description: Dependency added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      added:
                        type: boolean
                      ticket_id:
                        type: integer
                      depends_on_id:
                        type: integer
                      relation_type:
                        type: string
    delete:
      summary: Remove a dependency (path-based)
      tags:
        - Tickets
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
        - name: relationType
          in: path
          required: true
          schema:
            type: string
            enum:
              - blocked_by
              - depends_on
              - related
        - name: depId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dependency removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      removed:
                        type: boolean
                      ticket_id:
                        type: integer
                      depends_on_id:
                        type: integer

  # ==========================================================================
  # CONVERSATIONS
  # ==========================================================================
  /projects/{slug}/conversations:
    get:
      summary: List conversations for a project
      tags:
        - Conversations
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
    post:
      summary: Create a new conversation (or return existing)
      tags:
        - Conversations
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role_id
              properties:
                role_id:
                  type: integer
                  description: The role ID to create/find a conversation for
      responses:
        '201':
          description: Conversation created or returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /projects/{slug}/conversations/{conversationId}:
    get:
      summary: Get a conversation with messages
      tags:
        - Conversations
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{slug}/conversations/{conversationId}/messages:
    post:
      summary: Send a message in a conversation
      tags:
        - Conversations
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: path
          required: true
          schema:

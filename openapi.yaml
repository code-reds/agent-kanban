      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: "Max messages to return (defaults to 1)"
          required: false
          schema:
            type: integer
            default: 1
        - name: fetched_until
          in: query
          description: Only fetch messages after this message ID
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Unread messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadMessagesResponse'


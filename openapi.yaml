components:
  schemas:
    # ----- Standard Response Wrappers -----
    StandardSuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
        error:
          type: string
          nullable: true
          example: null

    StandardErrorResponse:
      type: object
      required:
        - success
        - error
        - code
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
        error:
          type: string
          example: "Resource not found"
        code:
          type: string
          example: "NOT_FOUND"

    # ----- Project -----
    Project:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          example: "agent-kanban"
        name:
          type: string
          example: "Agent Kanban"
        description:
          type: string
          example: "Kanban board for AI agent collaboration"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description:
          type: string
          maxLength: 2000

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000

    # ----- Column -----
    Column:
      type: object
      properties:
        id:
          type: integer
          example: 8
        project_id:
          type: integer
          example: 1
        slug:
          type: string
          description: URL-friendly column identifier
          example: "todo"
        name:
          type: string
          description: Human-readable column name
          example: "To Do"
        order:
          type: integer
          minimum: 0
          example: 0
        is_global:
          type: boolean
          example: false
        is_default:
          type: boolean
          example: true

    CreateColumnRequest:
      type: object
      required:
        - slug
        - name
        - order
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 255
        order:
          type: integer
          minimum: 0
        is_default:
          type: boolean
          default: false

    UpdateColumnRequest:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 255
        order:
          type: integer
          minimum: 0

    # ----- Global Column -----
    GlobalColumn:
      allOf:
        - $ref: '#/components/schemas/Column'

    CreateGlobalColumnRequest:
      type: object
      required:
        - slug
        - name
        - order
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 255
        order:
          type: integer
          minimum: 0
        is_default:
          type: boolean
          default: false

    UpdateGlobalColumnRequest:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 255
        order:
          type: integer
          minimum: 0

    # ----- Role -----
    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Human User"
        description:
          type: string
          example: "Full permissions for human users"
        access_level:
          type: string
          enum:
            - full
            - admin
            - write
            - read
          example: "full"

    CreateRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        access_level:
          type: string
          enum:
            - full
            - admin
            - write
            - read
          default: "read"

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000

    # ----- Global Role -----
    GlobalRole:
      allOf:
        - $ref: '#/components/schemas/Role'

    CreateGlobalRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        access_level:
          type: string
          enum:
            - full
            - admin
            - write
            - read
          default: "read"

    UpdateGlobalRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000

    # ----- Roles-Columns -----
    RolesColumn:
      type: object
      properties:
        id:
          type: integer
        role_id:
          type: integer
        project_id:
          type: integer
          nullable: true
        column_id:
          type: integer
          nullable: true
        is_default:
          type: integer
          example: 0

    CreateRolesColumnRequest:
      type: object
      required:
        - role_id
        - column_id
      properties:
        role_id:
          type: integer
        column_id:
          type: integer
        is_default:
          type: integer
          default: 0

    UpdateRolesColumnRequest:
      type: object
      properties:
        column_id:
          type: integer
        is_default:
          type: integer
          default: 0

    # ----- Global Roles-Columns -----
    GlobalRolesColumn:
      allOf:
        - $ref: '#/components/schemas/RolesColumn'

    CreateGlobalRolesColumnRequest:
      type: object
      required:
        - role_id
      properties:
        role_id:
          type: integer
        column_id:
          type: integer
          nullable: true
        is_default:
          type: boolean
          default: false

    UpdateGlobalRolesColumnRequest:
      type: object
      properties:
        column_id:
          type: integer
          nullable: true
        is_default:
          type: boolean
          default: false

    # ----- Workflow Transition -----
    WorkflowTransition:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
          nullable: true
        column_from:
          type: integer
        column_to:
          type: integer
        requires_comment:
          type: boolean
        is_global:
          type: boolean
          default: false
        entire_ticket_group:
          type: boolean
          default: false
        from_slug:
          type: string
          nullable: true
        to_slug:
          type: string
          nullable: true
        allowed_role_ids:
          type: string
          nullable: true
          description: Comma-separated role IDs

    CreateTransitionRequest:
      type: object
      required:
        - column_from
        - column_to
      properties:
        column_from:
          type: string
          description: Source column slug
        column_to:
          type: string
          description: Target column slug
        requires_comment:
          type: boolean
          default: false
        entire_ticket_group:
          type: boolean
          default: false
        allowed_roles:
          type: array
          description: Comma-separated role IDs or array of role IDs
          items:
            type: string

    UpdateTransitionRequest:
      type: object
      properties:
        requires_comment:
          type: boolean
        entire_ticket_group:
          type: boolean
        allowed_roles:
          type: array
          items:
            type: string

    # ----- Global Workflow -----
    GlobalWorkflowTransition:
      allOf:
        - $ref: '#/components/schemas/WorkflowTransition'

    CreateGlobalWorkflowRequest:
      type: object
      required:
        - column_from
        - column_to
      properties:
        column_from:
          type: string
        column_to:
          type: string
        requires_comment:
          type: boolean
          default: false
        entire_ticket_group:
          type: boolean
          default: false
        allowed_roles:
          type: array
          items:
            type: string

    UpdateGlobalWorkflowRequest:
      type: object
      properties:
        requires_comment:
          type: boolean
        entire_ticket_group:
          type: boolean
        allowed_roles:
          type: array
          items:
            type: string

    # ----- Access Rule -----
    AccessRule:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
          nullable: true
        column_id:
          type: integer
        role_id:
          type: integer
        action_type:
          type: string
          enum:
            - create
            - edit
            - delete
            - move
        is_global:
          type: boolean
          default: false
        column_slug:
          type: string
          nullable: true

    # ----- Ticket -----
    Ticket:
      type: object
      properties:
        id:
          type: integer
          example: 1
        project_id:
          type: integer
          example: 1
        parent_id:
          type: integer
          nullable: true
          example: null
        column:
          type: string
          description: Column slug
          example: "todo"
        column_id:
          type: integer
        title:
          type: string
          example: "Implement feature X"
        description:
          type: string
          example: "Description of feature X"
        labels:
          type: array
          items:
            type: string
        priority:
          type: integer
          minimum: 1
          maximum: 5
          example: 2
        estimate:
          type: number
          nullable: true
          description: Time estimate (hours or story points)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        created_by_role_id:
          type: integer

    CreateTicketRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          default: ""
        column:
          type: string
          description: Target column slug
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 2
        labels:
          type: array
          items:
            type: string
        estimate:
          type: number
          nullable: true
        parent_id:
          type: integer
          nullable: true
          description: Parent ticket ID for sub-tasks

    UpdateTicketRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 5
        labels:
          type: array
          items:
            type: string
        estimate:
          type: number
          nullable: true
        parent_id:
          type: integer
          nullable: true

    # ----- Comment -----
    Comment:
      type: object
      properties:
        id:
          type: integer
        ticket_id:
          type: integer
        author_role_id:
          type: integer
        content:
          type: string
        action_type:
          type: string
          nullable: true
        action_details:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    AddCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
        role_id:
          type: integer

    UpdateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
        role_id:
          type: integer

    # ----- Transition (per-ticket) -----
    TicketTransition:
      type: object
      properties:
        from_column:
          type: string
        to_column:
          type: string
        requires_comment:
          type: boolean
        comment:
          type: string
          nullable: true

    # ----- Move Ticket -----
    MoveTicketRequest:
      type: object
      required:
        - to_column
      properties:
        to_column:
          type: string
          description: Target column slug
        comment:
          type: string
          maxLength: 5000
        role_id:
          type: integer

    # ----- Dependency -----
    Dependency:
      type: object
      properties:
        id:
          type: integer
        ticket_id:
          type: integer
        depends_on_id:
          type: integer
        relation_type:
          type: string
          enum:
            - blocked_by
            - depends_on
            - related

    # ----- Status History -----
    StatusHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        ticket_id:
          type: integer
        from_column_id:
          type: integer
        to_column_id:
          type: integer
        actor_role_id:
          type: integer
        comment_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    # ----- Conversation -----
    Conversation:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        from_role_id:
          type: integer
        to_role_id:
          type: integer
        from_role_name:
          type: string
          nullable: true
        to_role_name:
          type: string
          nullable: true
        last_message_at:
          type: string
          format: date-time
        unread_count:
          type: integer
          default: 0
        message_count:
          type: integer

    Message:
      type: object
      properties:
        id:
          type: integer
        conversation_id:
          type: integer
        sender_role_id:
          type: integer
        sender_role_name:
          type: string
          nullable: true
        content:
          type: string
        created_at:
          type: string
          format: date-time
        fetched_until_id:
          type: integer

    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
        sender_role_id:
          type: integer

    # ----- Token -----
    Token:
      type: object
      properties:
        id:
          type: integer
        token_hash:
          type: string
        project_id:
          type: integer
        role_id:
          type: integer
        role_name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean

    CreateTokenRequest:
      type: object
      required:
        - role_id
      properties:
        role_id:
          type: integer
        description:
          type: string
          maxLength: 500
        expires_in:
          type: integer
          description: Token lifetime in hours

    # ----- Response Objects -----

    # Project responses
    ProjectListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Project'

    ProjectResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Project'

    ProjectDetailResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: integer
                slug:
                  type: string
                name:
                  type: string
                description:
                  type: string
                columns:
                  type: array
                  items:
                    $ref: '#/components/schemas/Column'
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/Role'
                workflow:
                  type: object
                  properties:
                    transitions:
                      type: array
                      items:
                        $ref: '#/components/schemas/WorkflowTransition'
                    access_rules:
                      type: array
                      items:
                        $ref: '#/components/schemas/AccessRule'
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time

    # Column responses
    ColumnListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Column'

    ColumnResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Column'

    # Global Column responses
    GlobalColumnListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/GlobalColumn'

    GlobalColumnResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GlobalColumn'

    # Role responses
    RoleListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Role'

    RoleResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Role'

    # Global Role responses
    GlobalRoleListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/GlobalRole'

    GlobalRoleResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GlobalRole'

    # Roles-Column responses
    RolesColumnsListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RolesColumn'

    RolesColumnResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RolesColumn'

    GlobalRolesColumnsListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/GlobalRolesColumn'

    GlobalRolesColumnResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GlobalRolesColumn'

    # Workflow responses
    WorkflowResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                transitions:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowTransition'
                access_rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/AccessRule'

    TransitionResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkflowTransition'

    # Global Workflow responses
    GlobalWorkflowListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/GlobalWorkflowTransition'

    GlobalWorkflowResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GlobalWorkflowTransition'

    # Access Rules responses
    AccessRulesListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AccessRule'

    GlobalAccessRulesListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AccessRule'

    # Ticket responses
    TicketListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Ticket'
            total:
              type: integer
              description: Total number of matching tickets
            done_total:
              type: integer
              description: Total number of done tickets

    TicketResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Ticket'

    TicketDetailResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: integer
                project_id:
                  type: integer
                parent_id:
                  type: integer
                  nullable: true
                column:
                  type: string
                column_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                labels:
                  type: array
                  items:
                    type: string
                priority:
                  type: integer
                  minimum: 1
                  maximum: 5
                estimate:
                  type: number
                  nullable: true
                is_blocked:
                  type: boolean
                blocking_ticket_ids:
                  type: array
                  items:
                    type: integer
                comments:
                  type: array
                  items:
                    $ref: '#/components/schemas/Comment'
                status_history:
                  type: array
                  items:
                    $ref: '#/components/schemas/StatusHistoryEntry'
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
                closed_at:
                  type: string
                  format: date-time
                  nullable: true

    TransitionsListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TicketTransition'

    CommentResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Comment'

    DependenciesResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                blocked_by:
                  type: array
                  items:
                    $ref: '#/components/schemas/Dependency'
                depends_on:
                  type: array
                  items:
                    $ref: '#/components/schemas/Dependency'
                related:
                  type: array
                  items:
                    $ref: '#/components/schemas/Dependency'

    # Conversation responses
    ConversationListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Conversation'

    ConversationResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Conversation'

    ConversationDetailResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                conversation:
                  $ref: '#/components/schemas/Conversation'
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/Message'

    MessageResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Message'

    UnreadMessagesResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/Message'
                fetched_until_id:
                  type: integer

    # Token responses
    TokenListResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Token'

    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Token'

    TokenSecretResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                id:
                  type: integer

    # Success/Error responses
    SuccessResponse:
      allOf:
        - $ref: '#/components/schemas/StandardSuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                deleted:
                  type: boolean

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    PermissionDenied:
      description: Role lacks permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    ValidationError:
      description: Invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    ConflictError:
      description: Conflict (e.g., column has tickets, circular dependency)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    WorkflowError:
      description: Workflow rules prevent the action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
